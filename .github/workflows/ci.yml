name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx tsc --noEmit
      - name: Summary
        run: echo '✅ TypeScript typecheck passed'

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx vitest run tests/unit --no-color --reporter=verbose
      - name: Summary
        run: echo '✅ Unit tests passed'

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx tsc
      - run: npx vitest run tests/integration --no-color --reporter=verbose --exclude tests/e2e
      - name: Summary
        run: echo '✅ Integration tests passed'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - name: Verify build output
        run: |
          ls -la dist/index.js
          echo '✅ Build complete'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # e2e 测试需要 mock telegram API，作为独立 job
